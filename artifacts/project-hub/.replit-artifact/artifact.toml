kind = "web"
previewPath = "/"
title = "Drawing Library"
description = "A focused architectural drawing register for managing drawings, reviews, assignments, projects, team coordination, notifications, and file history."
version = "1.0.0"
id = "artifacts/project-hub"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 3000

[services.development]
run = "pnpm --filter @workspace/project-hub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/project-hub", "run", "build" ]
serve = "static"
publicDir = "artifacts/project-hub/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "3000"
BASE_PATH = "/"
