components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: number
        minimum: 1
    UploadId:
      name: uploadId
      in: path
      required: true
      schema:
        type: number
        minimum: 1
    CommentId:
      name: commentId
      in: path
      required: true
      schema:
        type: number
        minimum: 1
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    Project:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        deletedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
      required: [id, name, deletedAt, createdAt]
    RecycleBinEntry:
      type: object
      properties:
        type:
          type: string
        id:
          type: number
        label:
          type: string
        deletedAt:
          type: string
          format: date-time
      required: [type, id, label, deletedAt]
    ProjectInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
      required: [name]
    ProjectNote:
      type: object
      properties:
        id:
          type: number
        projectName:
          type: string
        content:
          type: string
        authorId:
          type: number
        authorName:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, projectName, content, authorId, authorName, createdAt, updatedAt]
    ProjectNoteInput:
      type: object
      properties:
        projectName:
          type: string
          minLength: 1
        content:
          type: string
          minLength: 1
      required: [projectName, content]
    ProjectNoteUpdate:
      type: object
      properties:
        content:
          type: string
          minLength: 1
      required: [content]
    PersonalNote:
      type: object
      properties:
        id:
          type: number
        userId:
          type: number
        authorName:
          type: string
        title:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, userId, authorName, title, content, createdAt, updatedAt]
    PersonalNoteInput:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
          minLength: 1
      required: [content]
    PersonalNoteUpdate:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
          minLength: 1
      required: [content]
    ContactProject:
      type: object
      properties:
        id:
          type: number
        projectName:
          type: string
        role:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required: [id, projectName, role, notes, createdAt]
    Contact:
      type: object
      properties:
        id:
          type: number
        companyName:
          type: string
        contactName:
          type: ["string", "null"]
        type:
          type: string
          enum: [client, consultant, contractor, vendor, supplier, authority, other]
        service:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        notes:
