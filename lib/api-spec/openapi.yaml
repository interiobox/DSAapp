openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Architectural drawing management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: drawings
    description: Drawing library operations
  - name: projects
    description: Drawing project operations
  - name: contacts
    description: Shared contact, vendor, consultant, and project directory operations
  - name: notes
    description: Shared project notes and private personal notes
  - name: users
    description: Team directory operations
  - name: auth
    description: Portal username and password authentication
  - name: admin
    description: Administrator portal management
  - name: dashboard
    description: Dashboard and activity operations
  - name: storage
    description: Drawing file upload and serving operations
  - name: checklists
    description: Reusable project checklist operations
  - name: chat
    description: Team chat channels and messages
  - name: notifications
    description: Personal notifications and mentions
paths:
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in to the drawing portal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed-in portal user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalUser"
        "401":
          description: Invalid credentials
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the signed-in portal user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalUser"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out of the drawing portal
      responses:
        "204":
          description: Signed out
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /drawings:
    get:
      operationId: listDrawings
      tags: [drawings]
      summary: List architectural drawings
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/DrawingStatus"
        - name: discipline
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/DrawingDiscipline"
        - name: project
          in: query
          required: false
          schema:
            type: string
        - name: revision
          in: query
          required: false
          schema:
            type: string
        - name: assignedTo
          in: query
          required: false
          schema:
            type: string
        - name: due
          in: query
          required: false
          schema:
            type: string
            enum: [all, overdue, upcoming, none]
      responses:
        "200":
          description: Drawing library
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Drawing"
    post:
      operationId: createDrawing
      tags: [drawings]
      summary: Add a drawing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DrawingInput"
      responses:
        "201":
          description: Created drawing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Drawing"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List drawing projects
      responses:
        "200":
          description: Drawing projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Add a drawing project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /projects/recycle-bin:
    get:
      operationId: listDeletedProjects
      tags: [projects]
      summary: List deleted projects in the recycle bin
      responses:
        "200":
          description: Deleted projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "403":
          description: Authentication required
  /projects/{id}:
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Rename a drawing project
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Project name is required
        "403":
          description: Administrator access required
        "404":
          description: Project not found
        "409":
          description: A project with this name already exists
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Move a project to the recycle bin
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Project moved to the recycle bin
        "403":
          description: Authentication required
        "404":
          description: Project not found
  /projects/{id}/restore:
    post:
      operationId: restoreProject
      tags: [projects]
      summary: Restore a project from the recycle bin
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Restored project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "403":
          description: Administrator access required
        "404":
          description: Project not found
        "409":
          description: An active project already uses this name
  /recycle-bin:
    get:
      operationId: listRecycleBin
      tags: [projects]
      summary: List all deleted records in the recycle bin
      responses:
        "200":
          description: Deleted records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecycleBinEntry"
        "401":
          description: Authentication required
  /recycle-bin/{type}/{id}/restore:
    post:
      operationId: restoreRecycleBinEntry
      tags: [projects]
      summary: Restore a deleted record from the recycle bin
      parameters:
        - name:
            type
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Restored record
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: number
        "401":
          description: Authentication required
        "404":
          description: Recycle-bin entry not found
  /contacts:
    get:
      operationId: listContacts
      tags: [contacts]
      summary: List shared contacts
      parameters:
        - name: projectName
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Shared contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contact"
    post:
      operationId: createContact
      tags: [contacts]
      summary: Create a shared contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "201":
          description: Created contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
  /contacts/{id}:
    patch:
      operationId: updateContact
      tags: [contacts]
      summary: Update a shared contact
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactUpdate"
      responses:
        "200":
          description: Updated contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
    delete:
      operationId: deleteContact
      tags: [contacts]
      summary: Delete a shared contact
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Contact deleted
  /contacts/{id}/projects:
    post:
      operationId: addContactProject
      tags: [contacts]
      summary: Add a project association to a contact
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactProjectInput"
      responses:
        "200":
          description: Contact with the new project association
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
  /contacts/{id}/projects/{projectId}:
    delete:
      operationId: removeContactProject
      tags: [contacts]
      summary: Remove a project association from a contact
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: projectId
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "200":
          description: Contact without the removed project association
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
  /project-notes:
    get:
      operationId: listProjectNotes
      tags: [projects]
      summary: List shared notes for a project
      parameters:
        - name: projectName
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Shared project notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectNote"
    post:
      operationId: createProjectNote
      tags: [projects]
      summary: Add a shared project note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectNoteInput"
      responses:
        "201":
          description: Created project note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectNote"
  /project-notes/{id}:
    patch:
      operationId: updateProjectNote
      tags: [projects]
      summary: Update a shared project note
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectNoteUpdate"
      responses:
        "200":
          description: Updated project note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectNote"
    delete:
      operationId: deleteProjectNote
      tags: [projects]
      summary: Delete a shared project note
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Project note deleted
  /personal-notes:
    get:
      operationId: listPersonalNotes
      tags: [notes]
      summary: List the signed-in user's personal notes
      responses:
        "200":
          description: Personal notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PersonalNote"
    post:
      operationId: createPersonalNote
      tags: [notes]
      summary: Create a personal note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonalNoteInput"
      responses:
        "201":
          description: Created personal note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalNote"
  /personal-notes/{id}:
    patch:
      operationId: updatePersonalNote
      tags: [notes]
      summary: Update one of the signed-in user's personal notes
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonalNoteUpdate"
      responses:
        "200":
          description: Updated personal note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalNote"
    delete:
      operationId: deletePersonalNote
      tags: [notes]
      summary: Delete one of the signed-in user's personal notes
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Personal note deleted
  /checklist-templates:
    get:
      operationId: listChecklistTemplates
      tags: [checklists]
      summary: List reusable checklist templates
      responses:
        "200":
          description: Checklist templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChecklistTemplate"
    post:
      operationId: createChecklistTemplate
      tags: [checklists]
      summary: Create a reusable checklist template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChecklistTemplateInput"
      responses:
        "201":
          description: Created checklist template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistTemplate"
        "409":
          description: A template with this name already exists
  /checklist-templates/{id}:
    patch:
      operationId: updateChecklistTemplate
      tags: [checklists]
      summary: Update a reusable checklist template
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChecklistTemplateInput"
      responses:
        "200":
          description: Updated checklist template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistTemplate"
        "404":
          description: Checklist template not found
    delete:
      operationId: deleteChecklistTemplate
      tags: [checklists]
      summary: Delete a reusable checklist template
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted checklist template
        "404":
          description: Checklist template not found
  /project-checklists:
    get:
      operationId: listProjectChecklists
      tags: [checklists]
      summary: List checklists applied to projects
      parameters:
        - name: projectName
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Project checklists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectChecklist"
    post:
      operationId: applyChecklistTemplate
      tags: [checklists]
      summary: Apply a checklist template to a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectChecklistInput"
      responses:
        "201":
          description: Applied project checklist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectChecklist"
        "404":
          description: Checklist template not found
  /project-checklists/{id}:
    delete:
      operationId: deleteProjectChecklist
      tags: [checklists]
      summary: Remove a checklist from a project
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted project checklist
        "404":
          description: Project checklist not found
  /project-checklists/{id}/items/{itemId}:
    patch:
      operationId: toggleProjectChecklistItem
      tags: [checklists]
      summary: Complete or reopen a project checklist item
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: itemId
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChecklistItemUpdate"
      responses:
        "200":
          description: Updated project checklist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectChecklist"
        "404":
          description: Checklist item not found
  /chat/channels:
    get:
      operationId: listChatChannels
      tags: [chat]
      summary: List team chat channels
      responses:
        "200":
          description: Team chat channels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatChannel"
    post:
      operationId: createChatChannel
      tags: [chat]
      summary: Create a team chat channel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatChannelInput"
      responses:
        "201":
          description: Created chat channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatChannel"
        "409":
          description: A channel with this name already exists
  /chat/channels/{channelId}/join:
    post:
      operationId: joinChatChannel
      tags: [chat]
      summary: Join a team chat channel
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "200":
          description: Joined chat channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatChannel"
        "404":
          description: Chat channel not found
  /chat/channels/{channelId}/leave:
    post:
      operationId: leaveChatChannel
      tags: [chat]
      summary: Leave a team chat channel
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "200":
          description: Left chat channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatChannel"
        "400":
          description: Channel creator cannot leave their channel
        "404":
          description: Chat channel not found
  /chat/channels/{channelId}:
    delete:
      operationId: deleteChatChannel
      tags: [chat]
      summary: Delete a chat channel when the signed-in user is its only member
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "204":
          description: Chat channel deleted
        "400":
          description: Only a single-member group can be deleted
        "403":
          description: The signed-in user cannot delete this chat channel
        "404":
          description: Chat channel not found
  /chat/channels/{channelId}/members:
    get:
      operationId: listChatChannelMembers
      tags: [chat]
      summary: List members of a team chat channel
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "200":
          description: Chat channel members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatChannelMember"
        "404":
          description: Chat channel not found
  /chat/channels/{channelId}/messages:
    get:
      operationId: listChatMessages
      tags: [chat]
      summary: List messages in a chat channel
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "200":
          description: Chat messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
        "404":
          description: Chat channel not found
    post:
      operationId: createChatMessage
      tags: [chat]
      summary: Post a message to a chat channel
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "201":
          description: Created chat message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
        "404":
          description: Chat channel not found
  /chat/channels/{channelId}/read:
    post:
      operationId: markChatChannelRead
      tags: [chat]
      summary: Mark a chat channel read for the signed-in user
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "204":
          description: Channel marked read
        "404":
          description: Chat channel not found
  /chat/search:
    get:
      operationId: searchChatMessages
      tags: [chat]
      summary: Search messages across joined chat channels
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: channelId
          in: query
          required: false
          schema:
            type: number
            minimum: 1
      responses:
        "200":
          description: Matching chat messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatSearchResult"
  /chat/messages/{messageId}:
    patch:
      operationId: updateChatMessage
      tags: [chat]
      summary: Edit a chat message
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageUpdate"
      responses:
        "200":
          description: Updated chat message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
        "403":
          description: Only the author or an administrator can edit this message
        "404":
          description: Chat message not found
    delete:
      operationId: deleteChatMessage
      tags: [chat]
      summary: Delete a chat message
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "204":
          description: Chat message deleted
        "403":
          description: Only the author or an administrator can delete this message
        "404":
          description: Chat message not found
  /chat/messages/{messageId}/reactions:
    post:
      operationId: toggleChatMessageReaction
      tags: [chat]
      summary: Toggle a reaction on a chat message
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatReactionInput"
      responses:
        "200":
          description: Updated reaction summary
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatReaction"
        "404":
          description: Chat message not found
  /chat/direct:
    post:
      operationId: createChatDirectMessage
      tags: [chat]
      summary: Open a direct chat with another user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatDirectMessageInput"
      responses:
        "200":
          description: Direct chat channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatChannel"
        "404":
          description: User not found
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List team users
      responses:
        "200":
          description: Team users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
  /attendance:
    get:
      operationId: listAttendance
      tags: [attendance]
      summary: List employee attendance for a date
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Employee attendance register
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceEntry"
  /attendance/me:
    get:
      operationId: getMyAttendance
      tags: [attendance]
      summary: Get the signed-in employee's attendance for a date
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Signed-in employee attendance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceEntry"
  /attendance/me/month:
    get:
      operationId: getMyAttendanceMonth
      tags: [attendance]
      summary: Get the signed-in employee's attendance for a month
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: string
            pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
      responses:
        "200":
          description: Signed-in employee monthly attendance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceEntry"
        "400":
          description: Invalid or future month
          content:
